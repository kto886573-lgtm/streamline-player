name: Build Streamline APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Show Google OAuth SHA-1
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          RAW_SHA1=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-1 digest: //p' | head -n 1)
          test -n "$RAW_SHA1"
          echo "GOOGLE_OAUTH_SHA1=$(echo "$RAW_SHA1" | sed 's/../&:/g; s/:$//' | tr '[:lower:]' '[:upper:]')"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: streamline-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
